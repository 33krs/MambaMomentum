name: Performance improvement
description: Propose a measurable performance or bundle-size improvement
title: "perf: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form for performance work with a measurable baseline and acceptance target.

  - type: input
    id: problem
    attributes:
      label: Problem
      description: What measurable performance problem should be addressed?
      placeholder: The production frontend bundle exceeds the configured warning threshold.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the intended technical approach and its boundaries.
      placeholder: Identify route-level code splitting opportunities without changing user-visible behavior.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective checks that prove the work is complete.
      placeholder: |
        - Build completes successfully.
        - Initial bundle is below the agreed threshold.
        - Existing frontend tests remain green.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I confirm this issue is limited to performance and does not change product behavior.
          required: true
