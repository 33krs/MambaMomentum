name: Quality and maintenance
description: Propose test coverage, reliability, compatibility, or maintenance work
title: "quality: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for engineering-quality work that has a measurable outcome and does not introduce product scope.

  - type: input
    id: problem
    attributes:
      label: Problem
      description: What quality, reliability, compatibility, or coverage gap should be addressed?
      placeholder: Dashboard analytics endpoints have no integration coverage.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the technical approach and the boundaries that keep product behavior unchanged.
      placeholder: Add endpoint integration tests for the existing analytics responses without changing their contract.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective checks that prove the work is complete.
      placeholder: |
        - Relevant test suite passes.
        - The existing API or UI contract remains unchanged.
        - The regression scenario is covered.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I confirm this issue is limited to testing, reliability, compatibility, or maintenance work.
          required: true
